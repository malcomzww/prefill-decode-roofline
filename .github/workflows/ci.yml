name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Test
        run: uv run pytest -q

      # The portfolio's signature check: every number in the README is
      # generated, so a hand-edited result fails the build rather than
      # silently drifting from the code that produced it.
      #
      # Only the markdown is gated. results/roofline.png encodes measured
      # values in its pixels, so it differs on every run and on every machine
      # by construction -- byte-comparing it would fail the build for a reason
      # that says nothing about correctness. The claims in roofline.md are
      # stated as asserted bands precisely so that they *are* byte-stable,
      # which is what makes this gate meaningful.
      - name: Verify generated results are current
        run: |
          if [ -f scripts/generate_results.py ]; then
            uv run python scripts/generate_results.py
            git diff --exit-code results/roofline.md \
              || (echo "results/roofline.md is stale -- regenerate and commit" && exit 1)
          fi
